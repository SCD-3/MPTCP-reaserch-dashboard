<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Scenario</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/resource-create.css') }}">
    <script type="module" src="{{ url_for('static', filename='js/add-scenario.js') }}"></script>
</head>
<body>
    <main class="container">
        <header class="page-header">
            <a href="{{ url_for('scenarios_list') }}" class="back-button">← Back to scenarios</a>
            <p class="eyebrow">Scenario management</p>
            <h1>Add Scenario</h1>
            <p class="subtitle">Define a network scenario and its paths.</p>
        </header>

        <form
            id="scenario-form"
            class="form-card"
            action="{{ url_for('add_scenario_form') }}"
            method="POST"
            data-success-url="{{ url_for('scenarios_list') }}"
        >
            <section class="form-section">
                <div class="section-heading">
                    <h2>General information</h2>
                </div>

                <div class="field">
                    <label for="scenario-id">Scenario ID</label>
                    <input
                        type="text"
                        id="scenario-id"
                        name="id"
                        placeholder="scenario-001"
                        pattern="[a-z](?:[a-z0-9-]*[a-z0-9])?"
                        required
                    >
                    <small>Lowercase letters, numbers, and hyphens. Must start with a letter.</small>
                </div>

                <div class="field">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Two paths with different delays"
                        required
                    >
                </div>

                <div class="field">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        placeholder="Describe the scenario..."
                    ></textarea>
                </div>
            </section>

            <section class="form-section">
                <div class="section-heading">
                    <h2>Simulation settings</h2>
                </div>

                <div class="field-grid">
                    <div class="field">
                        <label for="duration-seconds">Duration (seconds)</label>
                        <input
                            type="number"
                            id="duration-seconds"
                            name="durationSeconds"
                            min="0"
                            step="any"
                            value="120"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="repetitions">Repetitions</label>
                        <input
                            type="number"
                            id="repetitions"
                            name="repetitions"
                            min="1"
                            step="1"
                            value="10"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="receiver-consumption">Receiver consumption (Mbps)</label>
                        <input
                            type="number"
                            id="receiver-consumption"
                            name="receiverConsumptionMbps"
                            min="0"
                            step="any"
                            value="80"
                            required
                        >
                    </div>
                </div>
            </section>

            <section class="form-section">
                <div class="section-heading">
                    <h2>Network paths</h2>
                    <p>Configure at least one network path.</p>
                </div>

                <div id="paths-list" class="parameters-list"></div>

                <p id="paths-error" class="field-error" aria-live="polite"></p>

                <button type="button" id="add-path" class="secondary-button">
                    + Add path
                </button>
            </section>

            <div id="form-message" class="form-message" aria-live="polite"></div>

            <div class="form-actions">
                <a href="{{ url_for('scenarios_list') }}" class="cancel-button">Cancel</a>
                <button type="submit" id="submit-button" class="submit-button">
                    Create Scenario
                </button>
            </div>
        </form>
    </main>
</body>
</html>
