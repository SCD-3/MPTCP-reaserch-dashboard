<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - Environment Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/environments/environment-view.css') }}">
</head>

<body>
    <main class="container">
        <a class="back-button" href="{{ url_for('environments_list') }}">
            <span>←</span>
            Back
        </a>

        <header class="page-header">
            <div>
                <span class="eyebrow">ENVIRONMENT DETAILS</span>
                <h1>{{ name }}</h1>
                <p class="subtitle">{{ description }}</p>
            </div>

            <span class="status {{ 'active' if isActive else 'inactive' }}">
                {{ "Active" if isActive else "Inactive" }}
            </span>
        </header>

        <section class="card">
            <h2>General information</h2>

            <div class="details-grid">
                <div class="detail">
                    <span class="label">Environment type</span>
                    <span class="value">{{ type }}</span>
                </div>

                <div class="detail">
                    <span class="label">Version</span>
                    <span class="value">{{ version }}</span>
                </div>
            </div>
        </section>

        <section class="card">
            <div class="section-header">
                <div>
                    <h2>Configuration</h2>
                    <p>Environment configuration parameters</p>
                </div>
                <span class="tag">JSON</span>
            </div>

            <pre class="code-block"><code>{{ configuration | tojson(indent=4) }}</code></pre>
        </section>

        <footer>
            Environment management
        </footer>
    </main>
</body>
